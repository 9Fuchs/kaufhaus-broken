name: RSS-Crawler

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSS-Feeds verarbeiten
        run: python crawler/crawler.py
        env:
          CRAWLER_TRIGGER: ${{ github.event_name }}

      - name: Laufdaten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/submissions.json public/data/crawler_status.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
          else
            git commit -m "Update RSS crawler data"
            git push
          fi